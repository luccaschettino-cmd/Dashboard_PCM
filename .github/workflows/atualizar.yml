name: Atualizar Supabase

on:
  workflow_dispatch:        # roda somente quando você mandar manualmente

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install gspread google-auth supabase

      - name: Criar arquivo de credenciais
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credenciais.json

      - name: Rodar script de atualização
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python atualizar_supabase.py
